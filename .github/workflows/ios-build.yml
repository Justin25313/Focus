# Builds an unsigned Focus.ipa on every push and publishes it as a GitHub
# release together with a SideStore source (source.json). Install/update
# on the iPhone through SideStore; SideStore signs with your Apple ID.
name: iOS build

on:
  push:
    branches: [main, claude/vigilant-hypatia-1o44v9]
    paths-ignore: ['**.md', 'assets/**']
  workflow_dispatch:

# Least privilege by default; only the job below may create releases.
permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Only in the original repository, never in forks.
    if: github.repository == 'Justin25313/Focus'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
          persist-credentials: false

      # Liquid Glass (@callstack/liquid-glass) needs the iOS 26+ SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, tests
        run: npm run check

      - name: Build unsigned ipa
        run: |
          xcodebuild -version
          ./scripts/build-ipa.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 1p dist/version.txt)
          BUILD=$(sed -n 2p dist/version.txt)
          TAG="v$VERSION-$BUILD"
          # Commit message without trailers (co-author, session links):
          # release notes and source.json are public.
          NOTES=$(git log -1 --pretty=%B \
            | sed -E '/^(Co-Authored-By|Claude-Session|Signed-off-by):/Id' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          node scripts/make-source.mjs \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG" "$NOTES"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/Focus.ipa dist/source.json dist/icon.png \
            --target "$GITHUB_SHA" \
            --title "Focus $VERSION ($BUILD)" \
            --notes "$NOTES" \
            --latest
